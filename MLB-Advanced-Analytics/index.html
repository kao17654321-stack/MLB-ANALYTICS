<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLB Analytics 101</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#142942;font-family:system-ui,'Noto Sans TC',sans-serif}header{background:#102a4c;color:white;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center;gap:12px}header b{letter-spacing:.12em}header small{color:#b8d0ed}.progress{height:5px;background:#dce5ef}.progress i{display:block;height:100%;background:#d33c4b;transition:width .2s}.layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:225px 1fr;gap:24px;padding:24px}aside{background:white;border:1px solid #dce5ef;border-radius:12px;padding:12px;height:fit-content}aside button{display:block;width:100%;text-align:left;background:transparent;color:#38516e;border:0;padding:9px 8px;font-size:13px;border-radius:5px}aside button.active{background:#e7effa;color:#102a4c;font-weight:bold}main{min-width:0}.panel{background:white;border:1px solid #dce5ef;border-radius:14px;padding:clamp(20px,4vw,48px);min-height:570px;box-shadow:0 8px 30px #102a4c08}.eyebrow{font-size:13px;color:#476b95;letter-spacing:.16em;font-weight:bold}h1{font-size:clamp(26px,4vw,46px);line-height:1.2;margin:12px 0 20px}p{font-size:18px;line-height:1.75}.formula{background:#102a4c;color:white;padding:20px;border-radius:8px;font-size:clamp(16px,2.2vw,23px);font-weight:700;overflow-wrap:anywhere}.example,.caveat{padding:14px 18px;border-left:4px solid #376eab;background:#f1f6fc;margin:16px 0;line-height:1.6}.caveat{border-color:#c27837;background:#fff8ef}.tag{font-size:12px;font-weight:bold;display:block;letter-spacing:.1em;margin-bottom:5px}.sources{font-size:12px;color:#54708d;line-height:1.8}.sources a{color:#235f9f;margin-right:8px}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}button{cursor:pointer;border:0;background:#102a4c;color:white;border-radius:7px;padding:10px 16px;font:inherit}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e0a03d}.interactive{border:1px solid #dce5ef;border-radius:9px;padding:16px;margin:18px 0}.interactive label{display:block;margin:10px 0}.interactive input{width:100%;accent-color:#235f9f}.big{font-size:34px;font-weight:800;color:#102a4c}.bar{height:25px;background:#e4edf8;border-radius:4px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:#376eab;color:white;font-style:normal;padding-left:8px;white-space:nowrap}.quiz button{display:block;margin:7px 0;background:#e7effa;color:#102a4c;text-align:left}.quiz button.correct{background:#d8f0e3}.quiz button.wrong{background:#f8dce0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cards div{padding:15px;background:#f1f6fc;border-radius:8px}.cards strong{display:block;font-size:30px}.muted{color:#59728f;font-size:13px}@media(max-width:750px){.layout{display:block;padding:12px}aside{display:none}.panel{min-height:0}.cards{grid-template-columns:1fr}header{padding:15px}}@media print{aside,.nav,header,.progress{display:none}.layout{display:block}.panel{box-shadow:none}}
</style></head><body><header><b>MLB / ANALYTICS 101</b><small>棒球進階數據 · LLM Wiki</small></header><div class="progress"><i id="progress"></i></div><div class="layout"><aside id="toc" aria-label="章節目錄"></aside><main><article class="panel" id="slide" aria-live="polite"></article><div class="nav"><button id="prev">← 上一頁</button><span id="count" class="muted"></span><button id="next">下一頁 →</button></div><p class="muted">鍵盤 ← / → 切換投影片 · 來源連結需網路，簡報本身可離線使用</p></main></div><script>
const data={"slides": [{"id": 1, "topic": "intro", "title": "從零開始理解 MLB 進階數據", "body": "從打擊、投球、整體價值與擊球品質四個角度分析球員。", "formula": "四個視角 → 綜合判斷", "example": "學完能說明 OPS、wRC+、FIP 與 WAR 的差異。", "caveat": "不要只靠單一數字判斷球員。", "sources": ["S01", "S02", "S03", "S04", "S05"]}, {"id": 2, "topic": "intro", "title": "為什麼需要進階數據？", "body": "傳統結果數據受機會與比賽情境影響；進階數據補充不同觀察角度。", "formula": "結果 ≠ 能力的完整描述", "example": "假設 A、B 打擊率同為 .300，但 A 保送更多，可能更常上壘。", "caveat": "進階指標也有模型假設。", "sources": ["S01", "S06"]}, {"id": 3, "topic": "batting", "title": "AVG、HR、RBI", "body": "AVG 看安打頻率，HR 看全壘打總數，RBI 看打點。", "formula": "AVG = H / AB", "example": "100 打數、30 安打 → .300。", "caveat": "打點受隊友上壘機會影響；AVG 不計保送。", "sources": ["S06"]}, {"id": 4, "topic": "batting", "title": "OBP、SLG 與 OPS", "body": "OBP 衡量上壘，SLG 衡量每打數壘打數。OPS 是兩者相加。", "formula": "OBP=(H+BB+HBP)/(AB+BB+HBP+SF)；SLG=TB/AB；OPS=OBP+SLG", "example": "假設 OBP .400、SLG .600 → OPS 1.000。", "caveat": "OPS 不區分兩部分對得分的不同權重。", "sources": ["S01", "S06"]}, {"id": 5, "topic": "advanced", "title": "OPS+ 與 wRC+", "body": "兩者以100為平均基準，校正聯盟與球場；wRC+ 以加權得分貢獻為基礎。", "formula": "100 = 聯盟平均", "example": "wRC+ 125 → 同等打席約高於平均25%。", "caveat": "OPS+ 並非單純 OPS 除以聯盟 OPS；wRC+ 不包含守備。", "sources": ["S01", "S02"]}, {"id": 6, "topic": "advanced", "title": "wOBA：加權上壘率", "body": "保送、安打與全壘打各有不同得分價值，不能全部視為相同。", "formula": "wOBA = 加權打擊事件總和 / 適用打席分母", "example": "示意權重：保送0.7、一壘安打0.9、全壘打2.0。", "caveat": "示意權重非官方球季係數；正式分母 AB+BB−IBB+SF+HBP。", "sources": ["S02", "S06"]}, {"id": 7, "topic": "pitching", "title": "ERA 與 WHIP", "body": "ERA 看每九局自責分；WHIP 看每局安打與保送造成的上壘。", "formula": "ERA=9×ER/IP；WHIP=(BB+H)/IP", "example": "假設90局、30自責分、70安打、20保送 → ERA 3.00、WHIP 1.00。", "caveat": "局數 .1/.2 表示一/二個出局數，不是十進位。", "sources": ["S07"]}, {"id": 8, "topic": "pitching", "title": "FIP 與 xFIP", "body": "FIP 著重全壘打、保送、觸身與三振；xFIP 將全壘打替換為預期全壘打。", "formula": "FIP=(13×HR+3×(BB+HBP)−2×K)/IP+C", "example": "假設100局、10 HR、30 BB、0 HBP、100 K、C=3.10 → FIP 3.30。", "caveat": "C 依球季調整；xFIP 假設聯盟平均 HR/FB，不一定適用每位投手。", "sources": ["S03", "S07"]}, {"id": 9, "topic": "war", "title": "WAR：球員整體價值", "body": "估計球員比可替代水準多貢獻多少勝場。", "formula": "野手 WAR ≈ 相對替代水準得分 / 每勝所需得分", "example": "假設多創造50分，每勝10分 → 約5 WAR。", "caveat": "不是實際多贏五場的保證；出賽時間也影響累積值。", "sources": ["S04"]}, {"id": 10, "topic": "war", "title": "fWAR 與 bWAR", "body": "兩套 WAR 使用相同概念但估計方法不同；投手差異尤其明顯。", "formula": "fWAR：FIP 為主｜bWAR：失分調整為主", "example": "同一投手可能出現不同 WAR，應在同平台比較。", "caveat": "勿直接混合兩套 WAR 或把差異當成錯誤。", "sources": ["S04", "S03"]}, {"id": 11, "topic": "statcast", "title": "Statcast 是什麼？", "body": "追蹤球與球員運動，將場上動作轉換成可分析數據。", "formula": "場上動作 → 量測 → 指標", "example": "擊球速度、角度可用來分析擊球品質。", "caveat": "量測資料與模型估計值不同。", "sources": ["S05", "S08"]}, {"id": 12, "topic": "statcast", "title": "EV、Barrel 與 Hard-Hit%", "body": "EV 是擊球初速；Barrel 同時考量速度與角度。", "formula": "Hard-Hit% = 初速 ≥ 95 mph 的 BBE / BBE × 100%", "example": "100次擊球事件中40次達95 mph → 40%。", "caveat": "不是所有強擊球都是 Barrel；分母不是打席。", "sources": ["S08"]}, {"id": 13, "topic": "statcast", "title": "xBA 與 xwOBA", "body": "依類似擊球的結果估計安打與打擊價值；部分擊球考慮跑速。", "formula": "比較實際值與期望值", "example": "假設 AVG .260、xBA .300，可能值得進一步調查。", "caveat": "差距不等於純運氣，也不保證未來回歸；xwOBA 並非只看擊球。", "sources": ["S08", "S05"]}, {"id": 14, "topic": "players", "title": "2025 真實球員案例", "body": "Judge 與 Ohtani 可比較擊球品質；Skenes 用投球指標解讀。", "formula": "2025 MLB 例行賽｜同一來源", "example": "Judge：AVG .331、96 barrels；Ohtani：55 HR、100 barrels；Skenes：ERA 1.97。", "caveat": "Barrels 為累積次數，不是 Barrel%；不同角色不可直接用不同指標排名。", "sources": ["S09", "S08", "S07"]}, {"id": 15, "topic": "review", "title": "測驗與總結", "body": "選擇符合問題的指標：上壘與長打、校正打擊、投球能力、整體價值。", "formula": "OPS → wRC+ → FIP → WAR", "example": "完成下方測驗，確認你能辨別各指標用途。", "caveat": "比較時注意球季、樣本、平台與分母。", "sources": ["S01", "S02", "S03", "S04"]}], "sources": {"S01": {"title": "OPS and OPS+", "url": "https://library.fangraphs.com/offense/ops/", "summary": "OPS = OBP + SLG；OBP=(H+BB+HBP)/(AB+BB+HBP+SF)；SLG=TB/AB。OPS+ 以聯盟平均100為基準並校正球場。OPS 對兩部分等權，並非精確得分模型。", "accessed": "2026-11-24"}, "S02": {"title": "wRC and wRC+", "url": "https://library.fangraphs.com/offense/wrc/", "summary": "wRC 是累積得分貢獻估計；wRC+ 校正球場及聯盟，100 為平均，125 表示每打席得分創造能力高25%。不包含守備與位置價值。", "accessed": "2026-11-24"}, "S03": {"title": "FIP", "url": "https://library.fangraphs.com/pitching/fip/", "summary": "FIP=(13×HR+3×(BB+HBP)−2×K)/IP+C。C 隨球季變動，使聯盟平均對齊 ERA；降低守備與事件順序影響，但非完全衡量投手能力。", "accessed": "2026-11-24"}, "S04": {"title": "What is WAR?", "url": "https://library.fangraphs.com/misc/war/", "summary": "WAR 估計相對替代水準的額外勝場；野手包含打擊、跑壘、守備及位置等調整。fWAR 投手以 FIP 為主，bWAR 投手以失分及守備等調整為主。", "accessed": "2026-11-24"}, "S05": {"title": "Statcast Glossary", "url": "https://www.mlb.com/glossary/statcast", "summary": "以追蹤系統量測球與球員運動，自2015年全面導入。區分實際量測與模型估計。", "accessed": "2026-11-24"}, "S06": {"title": "Complete List (Offense)", "url": "https://library.fangraphs.com/offense/offensive-statistics-list/", "summary": "AVG=H/AB；HR 為全壘打數；RBI 為打點。wOBA 依各種打擊結果的得分價值加權，權重隨球季變化。PA 與 AB 不同。", "accessed": "2026-11-24"}, "S07": {"title": "Complete List (Pitching)", "url": "https://library.fangraphs.com/pitching/complete-list-pitching/", "summary": "ERA=9×ER/IP；WHIP=(BB+H)/IP。xFIP 以飛球數乘聯盟 HR/FB 估算全壘打數，再套用 FIP 架構。", "accessed": "2026-11-24"}, "S08": {"title": "Statcast Metrics Context", "url": "https://baseballsavant.mlb.com/statcast-metrics-context", "summary": "EV 為擊球初速（mph），LA 為仰角（度）；Hard-Hit% 為初速至少95 mph的擊球事件比例；Barrel% 為符合速度與角度條件的擊球事件比例。xBA 與 xwOBA 根據類似擊球結果估計，部分擊球考慮跑速；球季 xwOBA 也納入保送及三振。", "accessed": "2026-11-24"}, "S09": {"title": "2025 MLB regular season stat leaders", "url": "https://www.mlb.com/news/2025-mlb-regular-season-stat-leaders", "summary": "2025 例行賽：Aaron Judge（NYY）AVG .331、96 barrels；Shohei Ohtani（LAD）55 HR、100 barrels；Paul Skenes（PIT）ERA 1.97。", "accessed": "2026-11-24"}}};let current=0;const $=id=>document.getElementById(id);const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function extra(id){if(id===4)return `<div class="interactive"><span class="tag">互動 OPS 計算器</span><div class="big" id="ops">1.000</div><label>OBP <output id="obpv">0.400</output><input id="obp" aria-label="OBP" type="range" min="0.2" max="0.6" step="0.005" value="0.4"></label><label>SLG <output id="slgv">0.600</output><input id="slg" aria-label="SLG" type="range" min="0.2" max="0.9" step="0.005" value="0.6"></label></div>`;if(id===5)return `<div class="interactive"><span class="tag">模擬 wRC+ 比較（100 為平均）</span>${[80,100,125,160].map(v=>`<div class="bar"><i style="width:${v/180*100}%">${v}</i></div>`).join('')}</div>`;if(id===8)return `<div class="interactive"><span class="tag">FIP 互動練習（假設 C=3.10、IP=100、BB=30、HBP=0、K=100）</span><label>全壘打數 <output id="hrv">10</output><input id="hr" aria-label="全壘打數" type="range" min="0" max="30" value="10"></label><div class="big" id="fip">3.30</div></div>`;if(id===14)return `<div class="cards"><div>NYY · Judge<strong>.331</strong>AVG · 96 Barrels</div><div>LAD · Ohtani<strong>55</strong>HR · 100 Barrels</div><div>PIT · Skenes<strong>1.97</strong>ERA</div></div>`;if(id===15)return `<div class="interactive quiz"><span class="tag">三題自我測驗</span>${[['wRC+ 125 的意思？',['比平均高25%','比平均低25%','125次安打'],0],['FIP 主要衡量？',['守備率','三振、保送、觸身與全壘打','球員薪資'],1],['WAR 的基準？',['聯盟平均','全明星球員','替代水準'],2]].map((q,i)=>`<section><b>${i+1}. ${q[0]}</b>${q[1].map((a,j)=>`<button data-q="${i}" data-correct="${j===q[2]}">${a}</button>`).join('')}<div id="feedback${i}" role="status"></div></section>`).join('')}</div>`;return ''}
function show(i){current=Math.max(0,Math.min(data.slides.length-1,i));const s=data.slides[current];$('slide').innerHTML=`<div class="eyebrow">LESSON ${String(s.id).padStart(2,'0')} / ${esc(s.topic.toUpperCase())}</div><h1>${esc(s.title)}</h1><p>${esc(s.body)}</p><div class="formula">${esc(s.formula)}</div><div class="example"><span class="tag">EXAMPLE / 實例</span>${esc(s.example)}</div>${extra(s.id)}<div class="caveat"><span class="tag">NOTE / 解讀限制</span>${esc(s.caveat)}</div><div class="sources">Wiki：<a href="wiki/${esc(s.topic)}.md">${esc(s.topic)}.md</a>｜原始來源：${s.sources.map(k=>`<a href="${esc(data.sources[k].url)}" target="_blank" rel="noopener">${esc(k)} ${esc(data.sources[k].title)}</a>`).join('')}</div>`;$('count').textContent=`${current+1} / ${data.slides.length}`;$('progress').style.width=`${(current+1)/data.slides.length*100}%`;$('prev').disabled=current===0;$('next').disabled=current===data.slides.length-1;document.querySelectorAll('#toc button').forEach((b,j)=>b.classList.toggle('active',j===current));if(s.id===4){const calc=()=>{let a=+$('obp').value,b=+$('slg').value;$('obpv').textContent=a.toFixed(3);$('slgv').textContent=b.toFixed(3);$('ops').textContent=(a+b).toFixed(3)};$('obp').oninput=$('slg').oninput=calc;calc()}if(s.id===8){$('hr').oninput=()=>{let h=+$('hr').value;$('hrv').textContent=h;$('fip').textContent=((13*h+90-200)/100+3.1).toFixed(2)}}document.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{document.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove('correct','wrong'));let ok=b.dataset.correct==='true';b.classList.add(ok?'correct':'wrong');$('feedback'+b.dataset.q).textContent=ok?'答對了！':'再試一次。'});}
$('toc').innerHTML=data.slides.map((s,i)=>`<button data-i="${i}">${String(s.id).padStart(2,'0')} · ${esc(s.title)}</button>`).join('');document.querySelectorAll('#toc button').forEach(b=>b.onclick=()=>show(+b.dataset.i));$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});show(0);
</script></body></html>
